name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
    branches: [main, v3]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject 要求 >=3.11，Dockerfile 用 3.11，README 写 3.12 —— 两者都验证
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: 静态检查（未定义名字 / 未使用导入）
        run: python -m pyflakes kernel/ adapters/

      - name: 内核独立性检查（application/domain 不得依赖旧 Agent）
        run: |
          set -e
          hits=$(grep -rn -E '^[[:space:]]*(from|import) Agent' kernel/application kernel/domain || true)
          if [ -n "$hits" ]; then
            echo "::error::kernel/application 或 kernel/domain 仍直接依赖旧 Agent/："
            echo "$hits"
            exit 1
          fi
          echo "内核独立性检查通过"

      - name: 运行测试
        run: python -m pytest tests/ -q